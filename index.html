<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>지구 탐험대 : 사라진 환경의 비밀</title>
<style>
:root{--ink:#2b2350;--orange:#ff8a1f;--orange-d:#c85f00;--green:#2fc566;--green-d:#178a43;--blue:#3a8dff;--blue-d:#1a5fc4;--purple:#8656f0;--purple-d:#5a2fc0;--pink:#ff4f8b;--pink-d:#c42a60;--yellow:#ffd23f;--yellow-d:#d79f00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#3b2a7a,#140f33);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','NanumGothic',sans-serif;color:var(--ink);touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:800px;flex:none;position:relative;overflow:hidden;transform-origin:center center;background:#8fd8ff}
#rotate{position:fixed;inset:0;background:#2b2350;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:28px;font-weight:800;z-index:9999;text-align:center}
#rotate .ph{width:90px;height:150px;border:8px solid #fff;border-radius:18px;margin-bottom:24px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

#bg{position:absolute;inset:0}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:50;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-title{flex:1;font-size:27px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 12px rgba(0,0,0,.15);paint-order:stroke}
.pill{display:flex;align-items:center;gap:7px;background:linear-gradient(#fff,#efeaff);border-radius:40px;padding:5px 18px 5px 6px;font-size:25px;font-weight:900;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 5px 0 rgba(30,20,80,.25);border:3px solid #fff}
.pill .ic{width:40px;height:40px}
.pill.gold{background:linear-gradient(#fff6cf,#ffd96a);border-color:#fff3b0;color:#7a4b00}
.pill.run{background:linear-gradient(#e7fff0,#b9f5cf);border-color:#e7fff0;color:#116b35}
.pill .lab{font-size:15px;font-weight:900;opacity:.75;margin-right:-2px}
.ibtn{width:60px;height:60px;border-radius:20px;border:3px solid #fff;background:linear-gradient(#fff,#ece6ff);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),0 6px 0 rgba(30,20,80,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.ibtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,20,80,.3)}
.ibtn svg{width:38px;height:38px}

.tabs{display:flex;gap:3px;flex:1;align-items:center}
.tab{width:64px;height:66px;flex:none;border-radius:16px;background:linear-gradient(#fff,#ece6ff);border:3px solid #fff;box-shadow:inset 0 -5px 0 var(--tc),0 4px 0 rgba(30,20,80,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:12px;font-weight:900;color:#4a3f80;letter-spacing:-.6px;padding-bottom:3px;transition:transform .12s}
.tab .ti{font-size:24px;line-height:29px}
.tab:active{transform:scale(.93)}
.tab.on{background:linear-gradient(#ffe48a,#ff9a2a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);transform:translateY(3px) scale(1.07);box-shadow:0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.35);z-index:2}
.tab.sep{margin-left:5px}
.tab .ck{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#2fc566;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#hud{padding:8px 10px!important;gap:6px!important}
#hud .pill{padding:4px 12px 4px 5px;font-size:22px;min-width:140px}
/* 📕 팝업 그림책 */
.book{position:absolute;left:34px;top:112px;width:1212px;height:672px;border-radius:26px;background:linear-gradient(#7a2f3f,#5a1f2c);box-shadow:0 18px 0 #3a1018,0 30px 50px rgba(0,0,0,.45),inset 0 0 0 5px #9a4a5a;perspective:1800px}
.book .pg{position:absolute;top:16px;bottom:22px;width:586px;overflow:hidden}
.book .pg.left{left:18px;border-radius:18px 4px 4px 18px;background:linear-gradient(90deg,#efe2c2 0%,#fbf4e2 8%,#fffaf0 70%,#eadbb8 96%,#d9c69c 100%);box-shadow:-4px 4px 0 #e6d6b0,-8px 8px 0 #d8c59a}
.book .pg.right{right:18px;border-radius:4px 18px 18px 4px;background:linear-gradient(270deg,#efe2c2 0%,#fbf4e2 8%,#fffaf0 70%,#eadbb8 96%,#d9c69c 100%);box-shadow:4px 4px 0 #e6d6b0,8px 8px 0 #d8c59a;padding:52px 44px 20px 52px}
.book .spine{position:absolute;left:50%;top:10px;bottom:16px;width:30px;margin-left:-15px;background:linear-gradient(90deg,transparent,rgba(80,50,20,.35) 45%,rgba(80,50,20,.45) 50%,rgba(80,50,20,.35) 55%,transparent);pointer-events:none}
.book .pgnum{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:16px;font-weight:800;color:#a8916a}
.popstage{position:absolute;left:24px;right:24px;top:34px;bottom:44px;perspective:900px;perspective-origin:50% 30%}
.popstage .layer{position:absolute;left:10px;right:10px;bottom:24px;height:400px;transform-origin:50% 100%;animation:popup .75s cubic-bezier(.2,1.5,.45,1) both;filter:drop-shadow(0 10px 6px rgba(80,50,20,.35))}
.popstage .layer svg{width:100%;height:100%;overflow:visible}
.popstage .l1{transform:translateY(12px)}
.popstage .l2{bottom:4px}
.popstage .popshadow{position:absolute;left:30px;right:30px;bottom:10px;height:34px;border-radius:50%;background:radial-gradient(rgba(80,50,20,.35),transparent 70%)}
@keyframes popup{0%{transform:rotateX(-88deg);opacity:.2}60%{opacity:1}100%{transform:rotateX(0)}}
.ribbons{position:absolute;top:-20px;left:640px;display:flex;gap:10px;z-index:5}
.rib{width:54px;height:58px;border-radius:6px 6px 0 0;background:var(--rc);color:#fff;font-size:24px;font-weight:900;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.4);transition:height .2s,transform .2s;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.rib.on{height:78px;transform:translateY(-6px)}
.corner{position:absolute;bottom:22px;width:84px;height:84px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:26px;font-weight:900;color:#7a5a30;cursor:pointer;z-index:6}
.corner.cr{right:18px;background:linear-gradient(315deg,transparent 48%,#e3d2a8 50%,#fff6e0 75%);border-radius:0 0 18px 0;justify-content:flex-end;padding-right:12px}
.corner.cl{left:18px;background:linear-gradient(45deg,transparent 48%,#e3d2a8 50%,#fff6e0 75%);border-radius:0 0 0 18px;justify-content:flex-start;padding-left:12px}
.corner:active{transform:scale(.92)}
.flip{position:absolute;top:16px;bottom:22px;width:586px;left:50%;transform-origin:0 50%;background:linear-gradient(270deg,#efe2c2,#fffaf0 40%,#f4e8cc);border-radius:4px 18px 18px 4px;display:none;z-index:8;box-shadow:0 0 30px rgba(0,0,0,.25)}
.flip.fwd{display:block;animation:flipF .76s ease-in-out forwards}
.flip.back{display:block;transform-origin:100% 50%;left:18px;border-radius:18px 4px 4px 18px;animation:flipB .76s ease-in-out forwards}
@keyframes flipF{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes flipB{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
.pg.right h2{margin:2px 0 4px;font-size:44px;font-weight:900;letter-spacing:-1.5px;color:#3a2a1a}
.chnum{font-size:22px;font-weight:900;letter-spacing:2px}
.chsub{font-size:21px;font-weight:700;color:#6b5a40;margin:0 0 10px;line-height:1.4}
.chstat{display:flex;gap:10px;margin-bottom:12px}
.chstat span{background:#fff;border:2px solid #e6d6b0;border-radius:14px;padding:4px 12px;font-size:19px;font-weight:900;color:#5a4a30}
.mlist{display:flex;flex-direction:column;gap:12px}
.mticket{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;border:3px solid #fff;box-shadow:inset 7px 0 0 var(--mc),0 5px 0 #d8c59a,0 8px 14px rgba(80,50,20,.18);cursor:pointer;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;transition:transform .12s}
.mticket:active{transform:scale(.97)}
.mticket .mic{width:62px;height:62px;flex:none;border-radius:16px;background:linear-gradient(#fff,#f3efff);box-shadow:inset 0 0 0 3px #eee;display:flex;align-items:center;justify-content:center;font-size:36px}
.mticket .mtx{flex:1;line-height:1.25}.mticket .mtx b{display:block;font-size:24px}.mticket .mtx small{font-size:16px;font-weight:700;color:#7a6a50}
.mticket .mbest{text-align:center;font-size:20px;font-weight:900;color:#7a4b00;line-height:1.1}.mticket .mbest small{display:block;font-size:12px;color:#a8916a}
.stamp{position:absolute;right:96px;top:50%;margin-top:-34px;width:68px;height:68px;border-radius:50%;border:4px double #e0303a;color:#e0303a;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;transform:rotate(-16deg);opacity:.85;background:rgba(255,255,255,.4);padding:6px;animation:stamp .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:.6s}
@keyframes stamp{0%{transform:rotate(-16deg) scale(2.2);opacity:0}100%{transform:rotate(-16deg) scale(1);opacity:.85}}
/* generic */
.screen{position:absolute;inset:0;animation:scrIn .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes scrIn{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
.btn{position:relative;border:none;border-radius:24px;padding:16px 34px;font-size:29px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:-.5px;overflow:hidden;
  background:linear-gradient(180deg,#ffb054 0%,#ff8a1f 55%,#f07400 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.12),0 8px 0 var(--orange-d),0 14px 22px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s,filter .2s}
.btn:active{transform:translateY(6px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 2px 0 var(--orange-d)}
.btn.green{background:linear-gradient(180deg,#6be596,#2fc566 55%,#1fae52);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.12),0 8px 0 var(--green-d),0 14px 22px rgba(0,0,0,.2)}
.btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.blue{background:linear-gradient(180deg,#7bb6ff,#3a8dff 55%,#2577ec);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.12),0 8px 0 var(--blue-d),0 14px 22px rgba(0,0,0,.2)}
.btn.blue:active{box-shadow:0 2px 0 var(--blue-d)}
.btn.purple{background:linear-gradient(180deg,#b08cff,#8656f0 55%,#7243e0);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.12),0 8px 0 var(--purple-d),0 14px 22px rgba(0,0,0,.2)}
.btn.purple:active{box-shadow:0 2px 0 var(--purple-d)}
.btn.pink{background:linear-gradient(180deg,#ff8ab3,#ff4f8b 55%,#f03a78);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.12),0 8px 0 var(--pink-d),0 14px 22px rgba(0,0,0,.2)}
.btn.pink:active{box-shadow:0 2px 0 var(--pink-d)}
.btn.white{color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff,#f1edff);box-shadow:inset 0 -5px 0 rgba(0,0,0,.06),0 8px 0 #c9c0ea,0 14px 22px rgba(0,0,0,.12)}
.btn.white:active{box-shadow:0 2px 0 #c9c0ea}
.btn.sm{font-size:23px;padding:11px 22px;border-radius:20px}
.btn[disabled],.btn.wait{filter:grayscale(.7) brightness(.95);pointer-events:none}
.btn.wait:after{content:"";position:absolute;left:0;bottom:0;height:6px;background:rgba(255,255,255,.8);animation:waitbar var(--wt,.8s) linear forwards}
@keyframes waitbar{from{width:0}to{width:100%}}
.card{background:linear-gradient(180deg,#fff 0%,#fbf9ff 100%);border-radius:30px;border:4px solid #fff;box-shadow:0 10px 0 rgba(43,35,80,.18),0 22px 40px rgba(20,10,60,.25)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #fff200)}50%{filter:drop-shadow(0 0 12px #fff200) drop-shadow(0 0 5px #ff9d00)}}

/* title */
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.namebox input{font-size:30px;font-weight:800;padding:12px 22px;border-radius:22px;border:5px solid #fff;box-shadow:0 0 0 5px var(--orange),0 10px 20px rgba(0,0,0,.2);width:330px;text-align:center;font-family:inherit;outline:none;user-select:text;-webkit-user-select:text;color:var(--ink)}

/* map */
.map-node{position:absolute;width:240px;text-align:center;cursor:pointer;transition:transform .15s}
.map-node:active{transform:scale(.95)}
.map-node .lbl{margin-top:4px;background:linear-gradient(#fff,#f3efff);border:3px solid #fff;border-radius:18px;padding:7px 10px;font-size:21px;font-weight:900;box-shadow:0 5px 0 rgba(30,20,80,.25);line-height:1.2}
.map-node .lbl small{display:block;font-size:17px;color:#7a5a00}
.map-node .num{position:absolute;top:8px;left:24px;width:52px;height:52px;border-radius:50%;color:#fff;font-size:29px;font-weight:900;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25);z-index:2}
.map-node .done{position:absolute;top:0;right:22px;font-size:46px;z-index:2;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.rankbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:720px;padding:8px 14px;display:flex;align-items:center;gap:12px;border-radius:26px}
.rankbar .track{flex:1;height:26px;border-radius:14px;background:#e4ddfb;overflow:hidden;box-shadow:inset 0 3px 4px rgba(0,0,0,.12)}
.rankbar .fill{height:100%;border-radius:14px;background:linear-gradient(90deg,#ffd23f,#ff8a1f);transition:width 1s}

/* chapter */
.ch-head{position:absolute;left:0;right:0;top:94px;text-align:center}
.ch-head h2{margin:0;font-size:46px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.22)}
.ch-head p{margin:4px 0 0;font-size:23px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mission-list{position:absolute;left:0;right:0;top:220px;display:flex;justify-content:center;gap:26px;padding:0 40px}
.mcard{width:280px;height:360px;padding:14px;text-align:center;cursor:pointer;position:relative;transition:transform .15s}
.mcard:active{transform:scale(.96)}
.mcard .art{height:180px;border-radius:22px;overflow:hidden;background:#e9f7ff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.05)}
.mcard .art svg{width:100%;height:100%;display:block}
.mcard h3{margin:10px 0 2px;font-size:27px;font-weight:900;line-height:1.15}
.mcard p{margin:0;font-size:18px;font-weight:700;color:#6b6491}
.mcard .best{margin-top:8px;display:inline-flex;gap:6px;align-items:center;background:linear-gradient(#fff6cf,#ffe28a);border-radius:20px;padding:4px 14px;font-size:20px;font-weight:900;color:#7a4b00}
.mcard .best .ic{width:26px;height:26px}
.mcard .done{position:absolute;top:-14px;right:-12px;background:linear-gradient(#6be596,#1fae52);color:#fff;border-radius:30px;padding:5px 14px;font-size:20px;font-weight:900;box-shadow:0 5px 0 var(--green-d);border:4px solid #fff}

/* guide */
.guide{position:absolute;display:flex;align-items:flex-end;gap:6px;z-index:40;pointer-events:none}
.bubble{background:#fff;border-radius:26px;padding:14px 20px;font-size:24px;font-weight:800;line-height:1.35;box-shadow:0 7px 0 rgba(0,0,0,.15);position:relative;max-width:520px;margin-bottom:40px}
.bubble:before{content:"";position:absolute;left:-16px;bottom:22px;border:12px solid transparent;border-right:18px solid #fff;border-left:0}
.bubble b{color:var(--orange-d)}

/* modal */
#modal{position:absolute;inset:0;background:rgba(20,12,60,.6);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal.show{display:flex}
#modal .box{width:760px;max-height:760px;padding:26px 34px 32px;text-align:center;position:relative;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
#modal .box h2{margin:0 0 8px;font-size:40px;font-weight:900}
#modal .box .big-art{width:300px;height:225px;margin:0 auto 6px;display:block;border-radius:22px;overflow:hidden}
#modal .box p{font-size:26px;font-weight:700;line-height:1.45;margin:10px 0}
#modal .tag{display:inline-block;background:var(--orange);color:#fff;font-weight:900;font-size:21px;border-radius:20px;padding:5px 16px;margin-bottom:6px}
#modal .tag.nat{background:#1fae52}#modal .tag.hum{background:#2577ec}
#modal .row{display:flex;gap:18px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.memo{background:#fff6d6;border:4px dashed #ffc23f;border-radius:20px;padding:10px 16px;font-size:23px;font-weight:800;margin-top:10px}
.scoreline{display:flex;gap:14px;justify-content:center;margin:10px 0}
.scoreline div{background:#f3f0ff;border-radius:18px;padding:8px 18px;font-size:22px;font-weight:900}
.scoreline b{display:block;font-size:34px;color:#c85f00}

#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%) translateY(-30px);background:rgba(43,35,80,.95);color:#fff;font-size:25px;font-weight:800;padding:13px 28px;border-radius:30px;opacity:0;transition:all .3s;z-index:300;pointer-events:none;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:400}
.flycoin{position:absolute;width:42px;height:42px;z-index:410;pointer-events:none;transition:all .75s cubic-bezier(.5,-0.4,.7,1)}
.flycoin svg{width:100%;height:100%}
.floatnum{position:absolute;z-index:420;pointer-events:none;font-size:34px;font-weight:900;color:#ffd23f;-webkit-text-stroke:2px #7a4b00;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.floatnum.minus{color:#ff4f6b;-webkit-text-stroke:2px #6b0020}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#spam{position:absolute;inset:0;z-index:600;background:rgba(20,12,60,.55);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center}
#spam.show{display:flex}
#spam .big{font-size:56px;font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.3)}
#spam .sm{font-size:26px;font-weight:800;margin-top:8px}
#spam .cd{font-size:90px;font-weight:900;color:#ffd23f;-webkit-text-stroke:3px #7a4b00;margin-top:6px}
.combo{position:absolute;z-index:60;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(#ff8ab3,#ff4f8b);border:4px solid #fff;border-radius:24px;padding:4px 16px;box-shadow:0 6px 0 var(--pink-d);pointer-events:none}

/* bingo */
.bingo-grid{position:absolute;left:30px;top:100px;width:620px;height:620px;display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:16px;background:linear-gradient(135deg,#ffc06a,#ff7b54);border-radius:34px;box-shadow:inset 0 4px 0 rgba(255,255,255,.4),0 12px 0 #c9502c,0 20px 30px rgba(0,0,0,.25);border:5px solid #fff3e0}
.bcell{background:linear-gradient(#fff,#f6f2ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-align:center;line-height:1.1;cursor:pointer;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.06),0 6px 0 #c94d2a;transition:transform .1s;padding:4px}
.bcell:active{transform:scale(.95)}
.bcell.hit{background:linear-gradient(#fff3a6,#ffd23f);box-shadow:0 6px 0 #c48a00}
.bcell.hit:after{content:"";position:absolute;inset:7px;border:7px solid rgba(255,60,120,.85);border-radius:50%;animation:pop .4s}
.bcell.miss{background:linear-gradient(#eee,#d6d6e2);color:#777}
.bcell.line{background:linear-gradient(#bff7d0,#6be596);box-shadow:0 6px 0 #1fae52}
.bcell.ans{animation:glow 1s infinite;outline:5px solid #fff200}
.caller{position:absolute;left:680px;top:100px;width:330px;height:470px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px}
.caller .q{font-size:20px;font-weight:900;color:#6b6491}
.caller .term{font-size:38px;font-weight:900;color:var(--orange-d)}
.caller .hint{font-size:22px;font-weight:800;line-height:1.35}
.caller .pic{width:290px;height:200px;margin:0 auto;border-radius:20px;overflow:hidden}
.timer{height:16px;border-radius:10px;background:#e4ddfb;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ff4f8b,#ffd23f,#2fc566);border-radius:10px}
.rival{position:absolute;right:20px;top:100px;width:240px;height:470px;padding:12px;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.rgrid div{height:44px;border-radius:8px;background:#efeaff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1.05;color:#8a83b0;padding:2px}
.rgrid div.hit{background:#8a7a6a;color:#fff}
.rgrid div.line{background:#5b4a3a;color:#fff}

/* scene games */
.scene-box{position:absolute;left:20px;top:96px;width:900px;height:680px;border-radius:30px;overflow:hidden;box-shadow:0 0 0 5px #fff,0 12px 0 5px rgba(30,20,80,.25),0 24px 40px rgba(0,0,0,.25);background:#bfe9ff}
.scene-box svg.scene{width:100%;height:100%;display:block}
.side{position:absolute;right:16px;top:96px;width:328px;height:680px;padding:16px;display:flex;flex-direction:column;gap:10px}
.side h3{margin:0;font-size:27px;font-weight:900;text-align:center}
.side .sub{font-size:18px;font-weight:700;color:#6b6491;text-align:center;margin-top:-4px}
.target-card{background:linear-gradient(#fff8e0,#ffe9a8);border-radius:24px;padding:10px;text-align:center;border:4px solid #fff;box-shadow:0 6px 0 #e0b23a}
.target-card .tt{font-size:19px;font-weight:900;color:#a0640a}
.target-card .tn{font-size:34px;font-weight:900;margin:2px 0}
.target-card .pv{width:260px;height:150px;margin:0 auto;border-radius:16px;overflow:hidden;background:linear-gradient(#e8f8ff,#d2f0c2);box-shadow:inset 0 0 0 3px rgba(0,0,0,.06)}
.target-card .th{font-size:19px;font-weight:800;color:#6b4a00;min-height:48px;line-height:1.3;margin-top:6px}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:40px;height:40px;border-radius:50%;background:#e4ddfb;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#a39bd0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.dots span.ok{background:linear-gradient(#6be596,#1fae52);color:#fff}
.dots span.now{background:linear-gradient(#ffd96a,#ff8a1f);color:#fff;transform:scale(1.15)}
.dots span.late{background:#c9c3dd;color:#fff}
.tool-row{display:flex;gap:12px;justify-content:center}
.tool{flex:1;height:126px;border-radius:26px;border:6px solid transparent;background:linear-gradient(#fff,#f3efff);box-shadow:0 7px 0 rgba(30,20,80,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer}
.tool.sel{border-color:var(--orange);background:linear-gradient(#fff,#ffeccd);transform:translateY(-4px)}
.tool svg{width:66px;height:66px}
.lbl-tag{cursor:pointer}
.stat{display:flex;justify-content:space-between;align-items:center;background:#f3f0ff;border-radius:16px;padding:7px 14px;font-size:21px;font-weight:900}
.stat b{font-size:27px;color:var(--purple-d)}

/* builder */
.palette{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal{background:linear-gradient(#fff,#f3efff);border-radius:18px;padding:6px 4px;text-align:center;font-size:18px;font-weight:900;box-shadow:0 6px 0 rgba(30,20,80,.18);cursor:grab;border:5px solid transparent;touch-action:none}
.pal.sel{border-color:var(--orange);background:linear-gradient(#fff,#ffeccd)}
.pal small{display:block;font-size:14px;color:#6b6491;font-weight:800}
.ghost{position:absolute;width:90px;height:90px;pointer-events:none;z-index:500;opacity:.92;transform:translate(-50%,-60%) scale(1.1);filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.meter{background:#f3f0ff;border-radius:16px;padding:8px 12px}
.meter .mt{display:flex;justify-content:space-between;font-size:20px;font-weight:900}
.meter .track{height:20px;border-radius:12px;background:#ddd6f7;overflow:hidden;margin-top:4px;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.meter .fill{height:100%;border-radius:12px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.meter .goal{position:absolute;top:-2px;bottom:-2px;width:4px;background:#2b2350;border-radius:2px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;background:#f3f0ff;border-radius:16px;padding:6px 12px;font-size:20px;font-weight:900;opacity:.55}
.step .n{width:36px;height:36px;border-radius:50%;background:#c9c0ee;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.step.now{opacity:1;background:#fff4e3;box-shadow:0 0 0 4px var(--orange) inset}
.step.now .n{background:var(--orange)}
.step.ok{opacity:1;background:#d4f8e0}.step.ok .n{background:var(--green)}

/* dex */
.dex-grid{position:absolute;left:30px;right:30px;top:96px;bottom:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;overflow-y:auto;padding:10px 6px 30px;-webkit-overflow-scrolling:touch}
.dcard{height:205px;border-radius:26px;background:linear-gradient(#fff,#f6f3ff);border:4px solid #fff;box-shadow:0 8px 0 rgba(30,20,80,.22);text-align:center;padding:8px;cursor:pointer;position:relative;transition:transform .12s}
.dcard:active{transform:scale(.96)}
.dcard .im{width:170px;height:124px;margin:0 auto;border-radius:16px;overflow:hidden}
.dcard .im svg{width:100%;height:100%}
.dcard .nm{font-size:24px;font-weight:900;margin-top:6px}
.dcard.lock{background:repeating-linear-gradient(45deg,#ebe6fc,#ebe6fc 14px,#f4f1ff 14px,#f4f1ff 28px)}
.dcard.lock .q{font-size:86px;font-weight:900;color:#c2b8ee;line-height:124px}
.dcard .no{position:absolute;left:12px;top:6px;font-size:16px;font-weight:900;color:#a39bd0;z-index:2}
.dcard .new{position:absolute;right:-8px;top:-8px;background:var(--pink);color:#fff;font-size:16px;font-weight:900;border-radius:12px;padding:3px 10px;border:3px solid #fff;z-index:2}
.dex-detail{display:flex;gap:24px;text-align:left;align-items:center}
.dex-detail .l{flex:none;width:300px;height:225px;border-radius:24px;overflow:hidden}
.dex-detail .r p{font-size:22px!important;margin:7px 0!important}
.dex-detail .r .k{display:inline-block;background:#efeaff;border-radius:12px;padding:3px 12px;font-size:18px;font-weight:900;color:var(--purple-d);margin-right:6px}
.badge{width:92px;height:100px}.badge.off{filter:grayscale(1) opacity(.3)}
.badge-row{display:flex;gap:12px;justify-content:center}
.chest{width:300px;height:260px;cursor:pointer;margin:0 auto;display:block}
</style>
</head>

<script>
/* =========================================================
   지구 탐험대 : 사라진 환경의 비밀  v2
   초4 사회 · 3. 다양한 환경과 삶의 모습
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
function seeded(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 화면 맞춤 ---------- */
let SCALE = 1;
function fit() { const w = window.innerWidth, h = window.innerHeight; SCALE = Math.min(w / 1280, h / 800); $('#stage').style.transform = `scale(${SCALE})`; $('#stage').style.borderRadius = (w < h ? 24 : 0) + 'px'; }
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
window.matchMedia && window.matchMedia('(orientation: portrait)').addEventListener && window.matchMedia('(orientation: portrait)').addEventListener('change', () => setTimeout(fit, 200));

const FX = { parts: [], running: false };

    x.save(); x.globalAlpha = Math.min(1, p.life / 25); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c;

}

const TABC = ['#c9a06a', '#8656f0', '#2fc566', '#3a8dff', '#ff8a1f', '#ff4f8b'];
const scrOf = id => (id === 'dex' || id === 'cert' || id === 'book') ? id : 'm_' + id;
function nextGame(after) {
  const ids = TABS.slice(1, 13).map(t => t[0]);
  if (after) { const i = ids.indexOf(after); return i >= 0 && i < 11 ? ids[i + 1] : 'cert'; }
  return ids.find(m => !S.done[m]) || 'cert';
}
function renderHUD(title = '', mode = 'game') {
  const h = $('#hud');
  if (mode === 'none') { h.innerHTML = ''; return; }
  const rk = RANKS[rankOf(totalCoins())];
  h.innerHTML = `<div class="tabs">${TABS.map(([id, ic, lb, ch], i) => `<div class="tab ${scrOf(id) === CUR ? 'on' : ''} ${i && TABS[i - 1][3] !== ch ? 'sep' : ''}" data-s="${scrOf(id)}" style="--tc:${TABC[ch]}"><div class="ti">${ic}</div>${lb}${S.done[id] ? '<div class="ck">✔</div>' : ''}</div>`).join('')}</div>
    <div class="pill gold" id="totPill">${ICO.coin}<div style="line-height:1"><span id="totN">${totalCoins()}</span><div class="lab" id="runN" style="font-size:12px;margin-top:2px;white-space:nowrap">${RUN ? '이번 +' + RUN.coins : rk[2] + ' ' + rk[1]}</div></div></div>
    <button class="ibtn" id="hSnd" aria-label="소리">${S.sound ? ICO.sOn : ICO.sOff}</button>`;
  $$('.tab', h).forEach(t => t.onclick = () => {
    const sc = t.dataset.s; if (sc === CUR) return;
    if (RUN && RUN.coins > 0) toast('이번 판 코인은 끝까지 해야 저장돼요!');
    SND.whoosh(); go(sc);
  });
  $('#hSnd').onclick = () => { S.sound = !S.sound; save(); $('#hSnd').innerHTML = S.sound ? ICO.sOn : ICO.sOff; SND.tap(); };
}
function renderHUDvals() { const r = $('#runN'), t = $('#totN'); if (r) r.textContent = RUN ? '이번 +' + RUN.coins : RANKS[rankOf(totalCoins())][2] + ' ' + RANKS[rankOf(totalCoins())][1]; if (t) t.textContent = totalCoins(); }

/* ---------- 라우터 ---------- */
let CUR = null;
const SCREENS = {};
function go(name, arg) {
  SCR_ID++; clearTimers(); closeModal(); modalSeq++; if (typeof finishing !== 'undefined') finishing = false;
  if (!String(name).startsWith('m_')) RUN = null;
  const scr = $('#screen'); scr.innerHTML = ''; CUR = name;
  const d = document.createElement('div'); d.className = 'screen'; scr.appendChild(d);
  try { SCREENS[name](d, arg); } catch (err) { console.error(err); toast('앗, 문제가 생겼어요. 처음 화면으로 갈게요.'); setTimeout(() => go('title'), 800); }
}
</script>
<script>
/* =========================================================
   그림 엔진 : 그라데이션 · 그림자 · 하이라이트로 입체감
   모든 부품은 (x,y) = 바닥 가운데 기준

const G = (x, y, s, inner) => `<g transform="translate(${x},${y}) scale(${s})">${inner}</g>`;
const SH = (rx = 20, ry = 5, y = 0) => `<ellipse cx="0" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#gShadow)"/>`;
const P = {
  sun: (x, y, s = 1) => G(x, y, s, `<circle r="90" fill="url(#gSunGlow)"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>${[...Array(12)].map((_, i) => `<path d="M-6 -50 L0 -68 L6 -50Z" fill="#ffd23f" transform="rotate(${i * 30})"/>`).join('')}</g><circle r="40" fill="url(#gSun)"/><ellipse cx="-12" cy="-14" rx="12" ry="7" fill="#fff" opacity=".6"/>`),
  cloud: (x, y, s = 1, gray) => G(x, y, s, `<g opacity=".97"><ellipse cx="4" cy="18" rx="70" ry="10" fill="${gray ? '#7d879c' : '#b9cde6'}" opacity=".45"/><g fill="${gray ? '#a4aec2' : 'url(#gCloud)'}"><circle cx="-40" cy="4" r="18"/><circle cx="-20" cy="-8" r="24"/><circle cx="6" cy="-18" r="31"/><circle cx="34" cy="-6" r="24"/><circle cx="54" cy="6" r="15"/><rect x="-58" y="2" width="128" height="18" rx="9"/></g><g fill="#fff" opacity="${gray ? .15 : .85}"><circle cx="-2" cy="-28" r="14"/><circle cx="-24" cy="-14" r="10"/><circle cx="28" cy="-16" r="9"/></g></g>`),
  tree: (x, y, s = 1, k = 'gLeaf') => G(x, y, s, `${SH(26, 7, 1)}<path d="M-5 0 Q-3 -14 -3 -28 L3 -28 Q3 -14 5 0Z" fill="url(#gBark)"/><path d="M-1 -18 q-6 -5 -10 -12 M1 -14 q6 -4 9 -10" stroke="#5a3416" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g fill="url(#${k})"><circle cx="-13" cy="-30" r="12.5"/><circle cx="13" cy="-31" r="12.5"/><circle cx="-7" cy="-44" r="14"/><circle cx="8" cy="-46" r="14.5"/><circle cx="0" cy="-34" r="14"/><circle cx="-1" cy="-56" r="11"/><circle cx="17" cy="-40" r="9"/><circle cx="-18" cy="-40" r="9"/></g>
    <path d="M-24 -30 Q0 -14 24 -30 Q14 -20 0 -19 Q-14 -20 -24 -30Z" fill="#06331a" opacity=".22"/>
    <g fill="#fff" opacity=".28"><circle cx="-9" cy="-55" r="4"/><circle cx="-16" cy="-45" r="2.6"/><circle cx="2" cy="-60" r="2.4"/></g>`),
  pine: (x, y, s = 1, snow) => G(x, y, s, `${SH(18, 4.5, 1)}<rect x="-3" y="-12" width="6" height="12" fill="url(#gBark)"/>${[[0, 20, 30], [-14, 17, 27], [-27, 13, 24], [-39, 9, 20]].map(([oy, w, h]) => `<path d="M${-w} ${oy - 8} L${-w * .55} ${oy - 11} L${-w * .7} ${oy - 13} L0 ${oy - 8 - h} L${w * .7} ${oy - 13} L${w * .55} ${oy - 11} L${w} ${oy - 8} Q0 ${oy - 3} ${-w} ${oy - 8}Z" fill="url(#gPine)"/>`).join('')}<path d="M0 -77 L-4 -60" stroke="#c9ffd6" stroke-width="1.5" opacity=".5"/>${snow ? '<path d="M-6 -66 L0 -77 L6 -66 L2 -64 L0 -67 L-2 -64Z" fill="#fff"/>' : ''}`),
  bush: (x, y, s = 1, k = 'gLeaf') => G(x, y, s, `${SH(18, 4)}<g fill="url(#${k})"><circle cx="-10" cy="-8" r="10"/><circle cx="8" cy="-8" r="10"/><circle cx="0" cy="-14" r="11"/></g><circle cx="-3" cy="-18" r="3" fill="#fff" opacity=".35"/>`),
  rock: (x, y, s = 1) => G(x, y, s, `${SH(18, 4)}<path d="M-16 0 L-12 -12 L-2 -18 L10 -14 L16 -2 L14 0Z" fill="#9097ab"/><path d="M-12 -12 L-2 -18 L10 -14 L2 -9Z" fill="#c4c9d8"/><path d="M2 -9 L10 -14 L16 -2 L14 0Z" fill="#6f7690"/>`),
  flowers: (x, y, s = 1, c = '#ff6fa0') => G(x, y, s, [[-8, 0, c], [0, -3, '#ffd23f'], [8, 1, c], [3, 3, '#fff']].map(([a, b, cc]) => `<path d="M${a} ${b} v6" stroke="#3a9a50" stroke-width="1.5"/><circle cx="${a}" cy="${b}" r="3.2" fill="${cc}"/><circle cx="${a}" cy="${b}" r="1.2" fill="#fff6a0"/>`).join('')),
  grass: (x, y, s = 1) => G(x, y, s, `<path d="M-6 0 q2 -10 0 -14 M0 0 q0 -12 3 -16 M6 0 q-1 -9 3 -12" stroke="#3fa54a" stroke-width="2.2" fill="none" stroke-linecap="round"/>`),
  mtn: (x, y, w, h, o = {}) => {
    const L = o.far ? 'url(#gMtnFarL)' : o.bare ? 'url(#gMtnBare)' : 'url(#gMtnL)', R = o.far ? 'url(#gMtnFarR)' : o.bare ? '#9a7650' : 'url(#gMtnR)';
    const px = x + (o.skew || 0), lp = `M${x - w / 2} ${y} L${px} ${y - h} L${px + w * .06} ${y}Z`, rp = `M${px} ${y - h} L${x + w / 2} ${y} L${px + w * .06} ${y}Z`;
    const ridge = [...Array(4)].map((_, k) => { const t = .25 + k * .17; return `M${px - w * .5 * t * .9} ${y - h + h * t} q${w * .04} ${h * .05} ${w * .07} ${h * .02}`; }).join(' ');

      <path d="M${px} ${y - h} L${px + w * .03} ${y - h * .6} L${px - w * .02} ${y - h * .35} L${px + w * .04} ${y}" stroke="#000" stroke-opacity=".1" stroke-width="3" fill="none"/>`}
      ${o.snow ? `<path d="M${px - w * .13} ${y - h * .7} L${px} ${y - h} L${px + w * .14} ${y - h * .7} L${px + w * .09} ${y - h * .66} L${px + w * .05} ${y - h * .73} L${px + w * .01} ${y - h * .67} L${px - w * .04} ${y - h * .74} L${px - w * .08} ${y - h * .67}Z" fill="url(#gSnow)"/><path d="M${px} ${y - h} L${px + w * .14} ${y - h * .7} L${px + w * .09} ${y - h * .66} L${px + w * .05} ${y - h * .73} L${px + w * .01} ${y - h * .67}Z" fill="#9fb6d6" opacity=".45"/>` : ''}</g>`;
  },
  house: (x, y, s = 1, roof = 'R', cream = true) => G(x, y, s, `${SH(30, 6, 1)}<rect x="-24" y="-28" width="30" height="28" fill="url(#${cream ? 'gWallCream' : 'gWall'})"/><path d="M6 -28 L26 -36 L26 -8 L6 0Z" fill="url(#${cream ? 'gSideCream' : 'gSide'})"/>
    <rect x="16" y="-52" width="6" height="16" fill="#9a6a4a"/><rect x="15" y="-54" width="8" height="3" fill="#7a4a30"/>
    <path d="M-29 -26 L-9 -52 L11 -26Z" fill="url(#gRoof${roof})"/><path d="M-9 -52 L13 -60 L32 -34 L11 -26Z" fill="url(#gRoof${roof})"/><path d="M-9 -52 L13 -60 L32 -34 L11 -26Z" fill="#000" opacity=".18"/><path d="M-26 -27 L-9 -49" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
    <rect x="-16" y="-16" width="9" height="16" rx="1" fill="#8a5a2b"/><circle cx="-9" cy="-8" r="1.2" fill="#ffd23f"/>
    <rect x="-3" y="-21" width="7" height="7" fill="#7fd0ff" stroke="#fff" stroke-width="1.5"/><path d="M11 -27 l9 -3.5 v8 l-9 3.5z" fill="#7fd0ff" stroke="#fff" stroke-width="1.2"/>`),
  apt: (x, y, s = 1, acc = '#ff8fb1', fl = 8, num) => {
    const h = fl * 13 + 10; let w = '';
    for (let r = 0; r < fl; r++) for (let k = 0; k < 3; k++) w += `<rect x="${-17 + k * 12}" y="${-h + 10 + r * 13}" width="8" height="8" fill="${(r * 3 + k) % 5 ? '#8fd0ff' : '#ffe680'}"/>`;
    let sw = ''; for (let r = 0; r < fl; r++) sw += `<path d="M22 ${-h + 12 + r * 13} l11 -4.4 v6 l-11 4.4z" fill="#a8d8f8" opacity=".8"/>`;
    return G(x, y, s, `${SH(34, 6, 1)}<rect x="-22" y="${-h}" width="44" height="${h}" fill="url(#gWall)"/><path d="M22 ${-h} L36 ${-h - 6} L36 -6 L22 0Z" fill="url(#gSide)"/><path d="M-22 ${-h} L-8 ${-h - 6} L36 ${-h - 6} L22 ${-h}Z" fill="#fff"/>
      <rect x="-22" y="${-h}" width="44" height="6" fill="${acc}"/>${w}${sw}<rect x="-6" y="-12" width="12" height="12" fill="#6b7088"/><rect x="2" y="${-h - 14}" width="12" height="9" rx="2" fill="#c9d0e0"/>${num ? `<text x="0" y="${-h + 26}" font-size="11" font-weight="900" text-anchor="middle" fill="${acc}" stroke="#fff" stroke-width="3" paint-order="stroke">${num}</text>` : ''}`);

  tower: (x, y, s = 1, h = 150, g = 'gGlass', spire) => {
    let m = ''; for (let i = 1; i < 4; i++) m += `<path d="M${-18 + i * 9} ${-h} V0" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>`;
    for (let r = 16; r < h; r += 16) m += `<path d="M-18 ${-h + r} H18" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>`;

  },

  cabbage: (x, y, s = 1) => G(x, y, s, `<circle cx="0" cy="-7" r="8.5" fill="#6fcf4a"/><circle cx="0" cy="-8" r="5.5" fill="#c9f59a"/><path d="M-8 -6 q8 7 16 0" stroke="#3f9a2a" stroke-width="2" fill="none"/>`),

let finishing = false;
async function completeMission(id, summaryHTML = '') {
  if (finishing || !RUN || RUN.id !== id) return; finishing = true;
  try {
    const live = liveToken();
    const got = Math.max(0, Math.round(RUN.coins)), old = S.best[id] || 0, beforeTot = totalCoins(), beforeRank = rankOf(beforeTot);
    const record = got > old;
    if (record) S.best[id] = got;
    S.done[id] = true; save(); RUN = null; renderHUDvals();
    SND.fan(); fireworks(record ? 5 : 3);
    const tot = totalCoins();
    await modal(`${CHR('wow', 110)}<h2>${record ? '🎉 최고 기록 갱신!' : '미션 완료!'}</h2>${summaryHTML}
      <div class="scoreline"><div>이번 미션<b>🪙 ${got}</b></div><div>최고 기록<b>🪙 ${Math.max(got, old)}</b></div><div>전체 코인<b>🪙 ${tot}</b></div></div>
      ${record ? `<p style="font-size:22px">전체 코인이 <b style="color:#c85f00">+${tot - beforeTot}</b> 늘었어!</p>` : `<p style="font-size:22px">최고 기록(${old})을 넘으면 전체 코인이 올라가!</p>`}`, { ok: '확인!' });
    if (!live()) return;
    const newly = MS[id].get.filter(t => !S.dex.includes(t));
    if (newly.length) { await cardReveal(newly); if (!live()) return; }
    const ch = MS[id].ch;
    if (chDone(ch) && !S.bonus[ch]) { await chestOpen(ch); if (!live()) return; }
    const nr = rankOf(totalCoins());
    if (nr > beforeRank) { confetti(); SND.fan(); await modal(`<div style="font-size:90px">${RANKS[nr][2]}</div><h2>등급 업!</h2><p><b style="color:#8656f0;font-size:34px">${RANKS[nr][1]}</b>(이)가 되었어!</p>`, { ok: '야호!' }); if (!live()) return; }
    if (allDone() && !S.allShown) { S.allShown = true; save(); go('cert'); return; }
    const nx = nextGame(id), nxName = nx === 'cert' ? '내 등급 보기' : (TABS.find(t => t[0] === nx) || [])[2];
    const r = await modal(`${CHR('happy', 100)}<h2>다음은 뭘 할까?</h2><p style="font-size:22px">그림책을 펼쳐 보거나, 위쪽 탭으로 바로 갈 수 있어!</p>`, { w: 860, btns: [{ t: '🔁 다시 도전', c: 'white', v: 'again' }, { t: '📕 그림책', c: 'purple', v: 'book' }, { t: `▶ ${nxName}`, c: 'green', v: 'next' }], delay: 400 });
    if (!live()) return;
    go(r === 'again' ? 'm_' + id : r === 'book' ? 'book' : scrOf(nx), r === 'book' ? ch - 1 : undefined);
  } finally { finishing = false; }
}
async function cardReveal(ids) {

  for (let i = 0; i < ids.length; i++) {

    await modal(`<div class="tag" style="background:#8656f0">🎴 새 용어 카드! (${S.dex.length}/20)</div><div class="big-art pop">${art(d.id)}</div><h2>${d.n}</h2><p>${d.def}</p><div class="memo">💡 ${d.memo}</div>`, { ok: i < ids.length - 1 ? '다음 카드 ▶' : '도감에 넣기!' });
  }
}

function makeDraggable(el, { onPick, onDrop, ghostHTML }) {
  el.addEventListener('pointerdown', e => {
    if (spamLocked()) return;
    e.preventDefault(); onPick && onPick();
    const start = { x: e.clientX, y: e.clientY }; let ghost = null, moved = false;
    const mv = ev => {
      if (!moved && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 12) return;
      moved = true;
      if (!ghost) { ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.innerHTML = ghostHTML(); $('#stage').appendChild(ghost); }
      const p = stagePt(ev); ghost.style.left = p.x + 'px'; ghost.style.top = p.y + 'px';
    };
    const up = ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (ghost) ghost.remove();
      if (moved && ev.type === 'pointerup') { const t = document.elementFromPoint(ev.clientX, ev.clientY); onDrop && onDrop(t, ev); }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

    const g = $(`.tile[data-c="${i}"] .b`, el), c = i % COLS, r = Math.floor(i / COLS), cx = OX + c * TW + TW / 2, by = OY + r * TH + TH - 6;
    if (tool === 'erase') { if (grid[i]) { grid[i] = null; g.innerHTML = ''; SND.pop(); update(); } return; }
    if (grid[i]) { SND.no(); toast('이미 건물이 있어! 🧽 지우개로 지워요.'); return; }
    grid[i] = tool; g.innerHTML = `<g class="pop" style="transform-box:fill-box;transform-origin:bottom center">${BLD[tool].d(cx, by)}</g>`;
    SND.pop(); const sr = $('#city').getBoundingClientRect(), stg = $('#stage').getBoundingClientRect();
    burst((sr.left - stg.left) / SCALE + cx, (sr.top - stg.top) / SCALE + by - 40, 12, { max: 5 });
    if (!seen[tool]) { seen[tool] = 1; toast(`${BLD[tool].e} ${BLD[tool].info}`, 3000); }
    update();
  }
  function update() {
    const hh = cnt('apt') * 100 + cnt('house'), used = grid.filter(Boolean).length;
    $('#sHH').textContent = hh + '세대'; $('#sAr').textContent = `${used}/40칸`;
    const G = [['hh', hh >= 300, `세대 300세대 이상 (${hh})`], ['sch', cnt('school') >= 1, '학교 짓기'], ['conv', cnt('hosp') >= 1 && cnt('mart') >= 1, '편의 시설: 병원 + 마트'], ['park', cnt('park') >= 1, '공원 만들기'], ['bus', cnt('bus') >= 1, '대중 교통(버스) 놓기'], ['road', cnt('road') >= 3, `도로 3칸 이상 (${cnt('road')})`]];
    G.forEach(([k, ok]) => { if (ok && !goalPaid[k]) { goalPaid[k] = 1; earn(20, elPt($('#goals'))); } });
    $('#goals').innerHTML = '<b>🎯 도시 목표 (각 🪙20)</b><br>' + G.map(([, ok, t]) => `${ok ? '✅' : '⬜'} ${t}`).join('<br>');
    const all = G.every(g => g[1]); $('#doneB').disabled = !all;
    const lv = hh >= 300 && all ? 3 : hh >= 200 ? 2 : hh >= 50 ? 1 : 0;
    $('#lvl').innerHTML = ['🌱 작은 마을', '🏘️ 커지는 마을', '🏙️ 작은 도시', '🌆 살기 좋은 도시!'][lv];
    if (lv > lastLv) { fireworks(2); toast(`레벨 업! ${['', '마을이 커지고 있어!', '사람이 많이 모여 도시가 되었어!', '편의 시설까지 갖춘 멋진 도시!'][lv]}`, 2200); }
    lastLv = Math.max(lastLv, lv);
    if (hh >= 200 && cnt('hosp') === 0 && !seen._h) { seen._h = 1; later(() => toast('😷 사람이 많아졌는데 병원이 없어요! 편의 시설이 필요해!', 2600), 2300); }
    if (cnt('house') >= 5 && !seen._a) { seen._a = 1; later(() => toast('🤔 주택은 1칸에 1세대! 땅(면적)이 금방 모자라겠지?', 3000), 2300); }
  }
  $$('.pal', el).forEach(p => {
    const k = p.dataset.k, sel = () => { tool = k; $$('.pal', el).forEach(x => x.classList.toggle('sel', x === p)); };
    p.onclick = () => { sel(); SND.tap(); };
    if (k !== 'erase') makeDraggable(p, { onPick: sel, ghostHTML: () => `<div style="font-size:70px;text-align:center">${BLD[k].e}</div>`, onDrop: t => { const tl = t && t.closest && t.closest('.tile'); if (tl) place(+tl.dataset.c); } });
  });
  $$('.tile', el).forEach(t => t.onclick = () => place(+t.dataset.c));
  update();
  $('#doneB').onclick = async () => {
    if (doneOnce) return; doneOnce = true;
    const hh = cnt('apt') * 100 + cnt('house'), used = grid.filter(Boolean).length;
    let extra = ''; if (used <= 30) { earn(20, { x: 640, y: 400 }); extra += '📐 땅을 아껴 썼어! +20<br>'; } if (cnt('park') >= 2) { earn(20, { x: 640, y: 440 }); extra += '🌳 공원이 2개 이상! +20'; }
    await modal(`<div class="tag">📐 면적과 세대</div><h2>내 도시 보고서</h2><p>땅 <b>40칸</b> 중 <b>${used}칸</b>의 면적을 사용했어.<br><b>${hh}세대</b>가 이 도시를 보금자리로 삼았어!</p>${extra ? `<p style="font-size:22px">${extra}</p>` : ''}<div class="memo">💡 아파트는 좁은 <b>면적</b>에 많은 <b>세대</b>가 살 수 있어서 도시에 아파트가 많아.</div>`, { ok: '퀴즈 풀기 ▶', delay: 1500 });
    if (!live()) return;
    const a = await modal(`${CHR('think', 100)}<h2 style="font-size:31px">"이 아파트에는 500세대가 살아요."<br>여기서 <b>세대</b>의 뜻은?</h2>`, { w: 860, btns: [{ t: '함께 사는 식구 단위', c: 'blue', v: 1 }, { t: '건물의 높이', c: 'purple', v: 2 }, { t: '땅의 넓이', c: 'pink', v: 3 }], delay: 1200 });
    if (!live()) return;
    if (a === 1) { SND.ok(); earn(20, { x: 640, y: 400 }); } else { SND.no(); await modal(`<h2>아쉬워!</h2><p><b>세대</b>는 한 집에서 함께 사는 식구 단위야.<br>땅의 넓이는 <b>면적</b>이라고 해!</p>`, { ok: '알겠어!' }); if (!live()) return; }
    completeMission('build', `<p>${hh}세대가 사는 도시 완성!</p>`);
  };
};

SCREENS.m_reclaim = (el) => {

        : `<g class="slot" data-i="${i}"><rect x="${x - 8}" y="536" width="236" height="42" rx="10" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="4" stroke-dasharray="12 8"/><text x="${x + 110}" y="565" font-size="20" font-weight="900" text-anchor="middle" fill="#fff">여기에 쌓기!</text></g>`; }).join('')}

  function panel() {

      makeDraggable($('#dikeBlk'), { ghostHTML: () => `<svg viewBox="0 0 120 50" style="width:140px"><rect x="4" y="10" width="112" height="32" rx="6" fill="#8c92a8"/></svg>`, onDrop: t => { if (t && t.closest && t.closest('.slot')) buildDike(); else toast('점선 칸 위에 놓아요!'); } });

    const qs = [['간척을 하면 갯벌이 더 넓어진다.', false, '간척을 하면 갯벌이 땅으로 바뀌어 갯벌은 줄어들어요.'], ['자연을 사람들의 생활에 맞게 바꾸는 것을 개발이라고 한다.', true, '맞아요! 간척도 바다를 바꾸는 개발이에요.'], ['간척은 바다를 둑으로 막고 물을 빼서 땅을 만드는 일이다.', true, '맞아요! 둑 쌓고 → 물 빼고 → 땅 만들기!']];

      if (!live()) return;
    }
    completeMission('reclaim', `<p>방조제 · 물 빼기 · 간척지 완성!</p>`);
  }
  setStep(0);
  modal(`${CHR('happy', 110)}<h2>바다를 육지로!</h2><p>옛날부터 사람들은 땅이 모자라면<br>바다를 막아 새 땅을 만들었어.<br>이걸 <b style="color:#ff8a1f">간척</b>이라고 해. 직접 해 볼까?</p>`, { ok: '해 보자!' });
};

    <div class="pg right" id="pgR"></div>
    <div class="spine"></div>
    <div class="corner cl" id="prevPg" ${BOOK_PAGE === 0 ? 'style="visibility:hidden"' : ''}>◀</div>

    <div class="flip" id="flip"></div>
  </div>`;
  renderPage();
  $$('.rib', el).forEach(r => r.onclick = () => turn(+r.dataset.p));
  $('#prevPg').onclick = () => turn(BOOK_PAGE - 1);
  $('#nextPg').onclick = () => turn(BOOK_PAGE + 1);
  let sx = null;
  $('#book').addEventListener('pointerdown', e => { sx = e.clientX; });
  $('#book').addEventListener('pointerup', e => { if (sx == null) return; const dx = (e.clientX - sx) / SCALE; sx = null; if (Math.abs(dx) > 90) turn(BOOK_PAGE + (dx < 0 ? 1 : -1)); });

  function turn(p) {
    if (turning || p < 0 || p > 5 || p === BOOK_PAGE) return;
    turning = true; const fwd = p > BOOK_PAGE, f = $('#flip');
    f.className = 'flip ' + (fwd ? 'fwd' : 'back'); SND.whoosh();
    later(() => { BOOK_PAGE = p; renderPage(); }, 380);
    later(() => { f.className = 'flip'; turning = false; }, 760);
  }
  function renderPage() {
    const i = BOOK_PAGE;
    $$('.rib', el).forEach(r => r.classList.toggle('on', +r.dataset.p === i));
    $('#prevPg').style.visibility = i === 0 ? 'hidden' : 'visible'; $('#nextPg').style.visibility = i === 5 ? 'hidden' : 'visible';
    $('.left .pgnum', el).textContent = `— ${i * 2 + 1} —`;
    $('#popL').innerHTML = POPS[i].map((f, k) => `<div class="layer l${k}" style="animation-delay:${.1 + k * .16}s"><svg viewBox="0 0 520 340">${f()}</svg></div>`).join('') + `<div class="popshadow"></div>`;
    const R = $('#pgR');
    if (i < 5) {
      const c = CH[i], dn = c.ms.filter(m => S.done[m]).length;
      R.innerHTML = `<div class="chnum" style="color:${c.c}">제 ${i + 1} 장</div><h2>${c.t}</h2><p class="chsub">${c.sub}</p>
        <div class="chstat"><span>✅ ${dn}/${c.ms.length} 완료</span><span>🪙 ${chBest(i + 1)}</span>${S.bonus[i + 1] ? '<span>🏅 배지</span>' : ''}</div>

          <div class="mic">${tb[1]}</div><div class="mtx"><b>${MS[m].t}</b><small>${MS[m].d}</small></div><div class="mbest">🪙 ${S.best[m] || 0}<small>최고 기록</small></div>
          ${S.done[m] ? `<div class="stamp">참 잘했어요</div>` : ''}</div>`; }).join('')}</div>
        <div class="pgnum">— ${i * 2 + 2} —</div>`;
      $$('.mticket', R).forEach(t => t.onclick = () => { SND.tap(); go('m_' + t.dataset.m); });
    } else {
      const tot = totalCoins(), ri = rankOf(tot), rk = RANKS[ri], nx = RANKS[ri + 1];
      R.innerHTML = `<div class="chnum" style="color:#c48a00">마지막 장</div><h2>${S.name || '탐험'} 대원의 기록</h2>
        <div style="font-size:64px;text-align:center;line-height:1.1">${rk[2]}</div><div style="text-align:center;font-size:34px;font-weight:900;color:#c85f00">${rk[1]}</div>
        <div class="chstat" style="justify-content:center"><span>🪙 전체 ${tot}</span><span>🎴 ${S.dex.length}/20</span><span>✅ ${Object.keys(S.done).length}/12</span></div>
        <p class="chsub" style="text-align:center">${nx ? `다음 등급 ${nx[2]} ${nx[1]}까지 <b>🪙 ${nx[0] - tot}</b>` : '최고 등급 달성! 👑'}</p>
        <div class="badge-row" style="margin:6px 0">${[1, 2, 3, 4, 5].map(n => badgeSVG(n, !S.badges.includes(n))).join('')}</div>
        <div style="display:flex;gap:14px;justify-content:center;margin-top:8px"><button class="btn purple sm" id="bkDex">🎴 도감</button><button class="btn sm" id="bkCert">🏆 인증서</button></div>
        <div class="pgnum">— 12 —</div>`;
      $('#bkDex').onclick = () => { SND.tap(); go('dex'); };
      $('#bkCert').onclick = () => { SND.tap(); go('cert'); };

      <div id="rsMsg" style="font-size:20px;font-weight:800;line-height:1.4;background:#f3f0ff;border-radius:16px;padding:10px;flex:1">활동을 고르고 반짝이는 곳을 터치해 원래대로 되돌려 줘!</div></div>`;
  const hp = () => Math.round(T0.filter(o => o.done).length / T0.length * 100);
  function draw() {

      <path d="M0 340 Q120 150 260 180 Q380 200 480 340Z" fill="${h > .5 ? 'url(#gMtnL)' : 'url(#gMtnBare)'}"/><path d="M380 340 Q560 170 720 210 Q840 240 900 340Z" fill="url(#gMtnR)"/>
      ${[[560, 310], [640, 270], [720, 280], [800, 310], [860, 320]].map(([x, y]) => P.tree(x, y, .8)).join('')}
      <path d="M0 340 L900 340 L900 680 L0 680Z" fill="${h > .5 ? 'url(#gGrass)' : '#c8c09a'}"/>
      <rect x="0" y="410" width="900" height="70" fill="${rv >= 3 ? 'url(#gWater)' : rv >= 1 ? '#6aa7c0' : '#7a8f7a'}"/>
      ${[0, 1, 2].map(k => T0[16 + k].done ? `<path d="M${k * 300} 410 q75 -14 150 0 t150 0" stroke="#5fbf4c" stroke-width="10" fill="none"/><path d="M${k * 300} 480 q75 14 150 0 t150 0" stroke="#5fbf4c" stroke-width="10" fill="none"/>${P.flowers(k * 300 + 60, 404, 1.4)}${P.flowers(k * 300 + 220, 406, 1.4, '#ffd23f')}` : `<rect x="${k * 300}" y="402" width="300" height="12" fill="#a8a8a8"/><rect x="${k * 300}" y="476" width="300" height="12" fill="#a8a8a8"/>`).join('')}

      ${h >= 1 ? `<g transform="translate(150,480)"><ellipse rx="22" ry="12" fill="#8a5a2b"/><circle cx="20" cy="-8" r="10" fill="#8a5a2b"/><circle cx="24" cy="-10" r="2" fill="#000"/></g>` + P.person(700, 640, 1.6, '#ff8a1f') + P.dog(730, 640, 1.4) : ''}
      ${T0.map(o => {
        if (o.t === 'tree') return o.done ? `<g class="pop" style="transform-box:fill-box;transform-origin:bottom center">${P.tree(o.x, o.y, .9, o.i % 2 ? 'gLeaf' : 'gLeaf2')}</g>` : `<g class="rs-t" data-i="${o.i}"><g transform="translate(${o.x},${o.y}) scale(1.6)"><path d="M-8 0 L-7 -10 L7 -10 L8 0Z" fill="url(#gTrunk)"/><ellipse cx="0" cy="-10" rx="7" ry="3" fill="#d2a46b"/></g><circle cx="${o.x}" cy="${o.y - 10}" r="34" fill="#fff" fill-opacity="0.001"/></g>`;

      ${m.trf < 40 ? `<text x="450" y="660" font-size="22" font-weight="900" text-anchor="middle" fill="#c42a60" stroke="#fff" stroke-width="5" paint-order="stroke">🚗🚗🚗 길이 꽉 막혀요!</text>` : ''}
      ${SLOTS.map(([x, y], i) => slots[i] ? `<g class="bslot" data-i="${i}"><ellipse cx="${x}" cy="${y + 34}" rx="80" ry="20" fill="url(#gShadow)"/>${bossArt(slots[i], x, y + 40)}<rect x="${x - 56}" y="${y + 46}" width="112" height="26" rx="10" fill="#fff" opacity=".92"/><text x="${x}" y="${y + 65}" font-size="17" font-weight="900" text-anchor="middle">${FAC[slots[i]].n}</text></g>`
        : `<g class="bslot" data-i="${i}"><circle cx="${x}" cy="${y}" r="52" fill="#fff" fill-opacity=".35" stroke="#fff" stroke-width="5" stroke-dasharray="10 8"/><text x="${x}" y="${y + 12}" font-size="34" font-weight="900" text-anchor="middle" fill="#fff">${i + 1}</text></g>`).join('')}${ATM()}`;
    $$('.bslot', $('#bs')).forEach(g => g.onclick = (e) => put(+g.dataset.i, stagePt(e)));
    $('#meters').innerHTML = Object.entries(MET).map(([k, [nm, c]]) => `<div class="meter" style="padding:6px 10px"><div class="mt"><span>${nm}</span><span style="color:${m[k] >= GOAL ? '#1fae52' : '#c42a60'}">${m[k]}${m[k] >= GOAL ? ' ✔' : ''}</span></div><div class="track"><div class="fill" style="width:${m[k]}%;background:${c}"></div><div class="goal" style="left:${GOAL}%"></div></div></div>`).join('');
  }
  let warned = false;
  function put(i, p) {
    if (ended) return;
    if (slots[i]) { const old = slots[i]; slots[i] = null; SND.pop(); toast(`${FAC[old].e} ${FAC[old].n}을(를) 철거했어요.`); draw(); return; }
    slots[i] = pick; SND.ok(); burst(p.x, p.y, 20, { max: 7 }); info(pick); draw();
    if (M().nat < 35 && !warned) { warned = true; later(() => toast('😷 자연환경이 많이 망가졌어! 개발만 하면 살기 어려워져!', 2800), 600); }
  }
  $$('.pal', el).forEach(p => p.onclick = () => { pick = p.dataset.k; $$('.pal', el).forEach(x => x.classList.toggle('sel', x === p)); info(pick); SND.tap(); });
  $('#bossDone').onclick = async () => {
    if (ended) return;
    const m = M(), lows = Object.keys(MET).filter(k => m[k] < GOAL);
    if (lows.length) {
      fails++; SND.no(); lose(10, elPt($('#bossDone')));
      const tip = { life: '편의 시설, 문화 시설, 주택, 공원으로 주민 생활을 챙겨요.', nat: '자연 복원과 공원으로 자연을 지켜요. 개발을 조금 줄여 볼까?', trf: '고속 국도나 대중 교통이 필요해요.', prd: '공장 단지나 농장으로 일자리를 만들어요.' };
      await modal(`${CHR('think', 110)}<h2>아직 균형이 안 맞아! (-10)</h2><p>${lows.map(k => `<b style="color:${MET[k][1]}">${MET[k][0]} ${m[k]}</b> → ${tip[k]}`).join('<br>')}</p><p style="font-size:21px">시설을 터치하면 철거할 수 있어. 다시 설계해 봐!</p>`, { w: 880, ok: '다시 설계하기', delay: 1500 });
      return;
    }
    ended = true;
    const mn = Math.min(...Object.values(m));
    earn(100 + (mn - GOAL) * 5, { x: 640, y: 400 });
    if (fails === 0) earn(30, { x: 640, y: 440 });
    fireworks(5);
    const built = slots.filter(Boolean);
    await modal(`<h2>🏙️ ${S.name} 시장님의 지역 완성!</h2><svg viewBox="70 0 760 680" style="width:470px;height:420px;border-radius:20px;display:block;margin:0 auto">${$('#bs').innerHTML}</svg>
      <div style="text-align:left;font-size:18px;font-weight:700;max-height:150px;overflow:auto;background:#f3f0ff;border-radius:16px;padding:10px 14px;margin-top:10px">${built.map(k => `${FAC[k].e} <b>${FAC[k].n}</b>: 👍 ${FAC[k].good} ⚠️ ${FAC[k].bad}`).join('<br>')}</div>`, { w: 900, ok: '평가 보기 ▶', delay: 1500 });
    if (!live()) return;
    await modal(`${CHR('wow', 110)}<h2>균형 잡힌 지역이 되었어!</h2><p>${Object.entries(MET).map(([k, [nm, c]]) => `<b style="color:${c}">${nm} ${m[k]}</b>`).join(' · ')}</p><p>편리하게 개발하면서도 <b>자연환경</b>을 지켰어.<br>${fails === 0 ? '한 번에 성공! 보너스 🪙30' : `균형 점수가 높을수록 코인이 많아!`}</p>`, { w: 880, ok: '최종 미션 완료!', delay: 1200 });
    if (live()) completeMission('boss', `<p>가장 낮은 점수 ${mn} (목표 60)</p>`);
  };
  info(pick); draw();
  modal(`${CHR('wow', 120)}<h2>최종 미션: 미래 지역 설계자</h2><p>${S.name} 대원이 이 지역의 <b>시장</b>이야!<br>빈 땅 7칸에 시설을 지어서<br><b style="color:#ff4f8b">주민 생활</b>, <b style="color:#1fae52">자연환경</b>, <b style="color:#3a8dff">교통</b>, <b style="color:#ff8a1f">생산 활동</b>을<br>모두 <b>60 이상</b>으로 만들어 줘!</p><div class="memo">⚠️ 개발만 하면 자연이 무너져! 평가 실패하면 -10</div>`, { ok: '설계 시작!', delay: 1500 });
};

/* ---------- 시작 ---------- */
$('#stage').addEventListener('pointerdown', spamGuard, true);
$('#stage').addEventListener('click', spamGuard, true);
fit(); go('title');
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
